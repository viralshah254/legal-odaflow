<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in — Umbrella</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to sign-in…</p>
    <script type="text/javascript">
      (function () {
        var WEB_APP_URL = "__WEB_APP_URL__";
        var params = new URLSearchParams(window.location.search);
        if (!params.get("returnUrl") || !params.get("provider")) {
          document.body.textContent = "Missing sign-in parameters.";
          return;
        }
        window.location.replace(
          WEB_APP_URL + "/office-addin-oauth.html?" + params.toString(),
        );
      })();
    </script>
  </body>
</html>
