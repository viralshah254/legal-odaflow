# Legal API - legal-api.odaflow.com
# Certbot will add listen 443 ssl and HTTP→HTTPS redirect when run.
# Backend listens on PORT 4000.

upstream legal_api_backend {
    server 127.0.0.1:4000;
    ip_hash;
    keepalive 32;
}

server {
    server_name legal-api.odaflow.com;

    # Socket.IO - MUST come first (same as production)
    location /socket.io/ {
        proxy_pass http://legal_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Long-running AI endpoints (research, copilot, document review, FIR analysis)
    # These can take 3-10 minutes; must come before the catch-all location /.
    location ~ ^/api/v1/ai/ {
        proxy_pass http://legal_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # AI-heavy consumer endpoints (preview, teaser, classify) — can take 1-3 minutes.
    # Must come before the catch-all location / so they are not capped at 60s.
    location ~ ^/api/v1/consumers/issue-checker/ {
        proxy_pass http://legal_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Regular API routes
    location / {
        proxy_pass http://legal_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # Health check endpoints
    location /api/v1/health {
        proxy_pass http://legal_api_backend;
        access_log off;
    }

    location /health {
        proxy_pass http://legal_api_backend;
        access_log off;
    }

    # Global upload limits and timeouts
    client_max_body_size 25M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # File upload endpoints
    location ~ ^/api/v1/upload {
        proxy_pass http://legal_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 300s;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Webhook locations
    location /webhook {
        proxy_pass http://localhost:3000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /webhook/health {
        proxy_pass http://localhost:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /webhook/status {
        proxy_pass http://localhost:3000/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/dashboard {
        proxy_pass http://localhost:3000/dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/deployments {
        proxy_pass http://localhost:3000/deployments;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/legal-api.odaflow.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/legal-api.odaflow.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = legal-api.odaflow.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name legal-api.odaflow.com;
    listen 80;
    return 404; # managed by Certbot
}
