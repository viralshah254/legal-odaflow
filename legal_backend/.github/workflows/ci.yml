name: CI

on:
  push:
    branches: [ server]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Validate template library seeds
        run: npm run validate:templates

      - name: Validate India act structure reference
        run: npm run validate:india-act-structure

      - name: Build Legal OdaFlow API
        run: npm run build
