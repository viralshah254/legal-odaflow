name: Dev Build and Deploy

on:
  push:
    branches: [liveness]

jobs:
  docker-build-and-push-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/liveness' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ayienda
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image (dev)
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: ./api
          file: ./api/Dockerfile.optimized
          push: true
          tags: |
            ayienda/odaflow:dev
            ayienda/odaflow:dev-${{ github.sha }}
          cache-from: |
            type=registry,ref=ayienda/odaflow:buildcache-dev
          cache-to: |
            type=registry,ref=ayienda/odaflow:buildcache-dev,mode=min
          platforms: linux/amd64

      - name: Trigger Dev Server Deployment
        run: |
          echo "✅ Dev image pushed to Docker Hub successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "Image: ayienda/odaflow:dev-${{ github.sha }}"
          echo ""
          echo "Triggering dev server deployment..."

          WEBHOOK_PAYLOAD=$(jq -n \
            --arg ref "refs/heads/liveness" \
            --arg repo_name "odaflow-backend" \
            --arg commit_id "${{ github.sha }}" \
            --arg commit_message "${{ github.event.head_commit.message }}" \
            --arg commit_author "${{ github.actor }}" \
            --arg commit_timestamp "${{ github.event.head_commit.timestamp }}" \
            '{
              "ref": $ref,
              "repository": {
                "name": $repo_name
              },
              "head_commit": {
                "id": $commit_id,
                "message": $commit_message,
                "author": {
                  "name": $commit_author
                },
                "timestamp": $commit_timestamp
              }
            }')

          echo "🔍 Dev Webhook URL: ${{ secrets.DEV_WEBHOOK_URL }}"
          echo "🔍 Dev Webhook secret configured: ${{ secrets.DEV_WEBHOOK_SECRET != '' }}"

          SIGNATURE=$(echo -n "$WEBHOOK_PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.DEV_WEBHOOK_SECRET }}" -binary | xxd -p -c 256)
          echo "🔍 Calculated signature: sha256=$SIGNATURE"

          echo "🚀 Sending webhook request to dev server..."
          curl -v -X POST "${{ secrets.DEV_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$WEBHOOK_PAYLOAD"
