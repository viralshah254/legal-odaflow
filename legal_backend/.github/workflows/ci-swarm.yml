name: Docker Build and Deploy

on:
  push:
    branches: [main]

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Clear GitHub Actions Cache (if needed)
        if: failure()
        run: |
          echo "Clearing GitHub Actions cache..."

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ayienda
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate deps cache key
        id: deps-cache
        run: echo "hash=$(sha256sum package-lock.json 2>/dev/null | cut -d' ' -f1 || echo ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        timeout-minutes: 15
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            CACHEBUST=${{ steps.deps-cache.outputs.hash }}
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            CI_WORKFLOW=ci-swarm.yml
            CI_RUN_ID=${{ github.run_id }}
            DEPLOY_PROBE_MARKER=deploy-probe-${{ github.run_number }}
          push: true
          tags: |
            ayienda/legal-byodaflow:latest
            ayienda/legal-byodaflow:${{ github.sha }}
          cache-from: |
            type=registry,ref=ayienda/legal-byodaflow:buildcache
          cache-to: |
            type=registry,ref=ayienda/legal-byodaflow:buildcache,mode=min
          platforms: linux/amd64

      - name: Trigger Server Deployment
        env:
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          GH_MESSAGE: ${{ github.event.head_commit.message }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          echo "✅ Image pushed to Docker Hub successfully!"
          echo "Commit: ${GH_SHA}"
          echo "Author: ${GH_ACTOR}"
          echo "Image: ayienda/legal-byodaflow:${GH_SHA}"
          echo ""
          echo "Triggering server deployment..."

          # Use env vars (not inline expressions) so special chars in commit messages
          # (em dashes, quotes, etc.) are passed safely as --arg strings to jq.
          WEBHOOK_PAYLOAD=$(jq -n \
            --arg ref "refs/heads/main" \
            --arg repo_name "legal_backend" \
            --arg commit_id "${GH_SHA}" \
            --arg commit_message "${GH_MESSAGE}" \
            --arg commit_author "${GH_ACTOR}" \
            --arg commit_timestamp "${GH_TIMESTAMP}" \
            '{
              "ref": $ref,
              "repository": { "name": $repo_name },
              "head_commit": {
                "id": $commit_id,
                "message": $commit_message,
                "author": { "name": $commit_author },
                "timestamp": $commit_timestamp
              }
            }')

          echo "🔍 Webhook URL: ${WEBHOOK_URL}"
          echo "🔍 Webhook secret configured: $([ -n "${WEBHOOK_SECRET}" ] && echo yes || echo no)"

          SIGNATURE=$(echo -n "${WEBHOOK_PAYLOAD}" | openssl dgst -sha256 -hmac "${WEBHOOK_SECRET}" -binary | xxd -p -c 256)
          echo "🔍 Calculated signature: sha256=${SIGNATURE}"

          echo "🚀 Sending webhook request..."
          HTTP_CODE=$(curl -sS -o /tmp/webhook-response.json -w "%{http_code}" -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "${WEBHOOK_PAYLOAD}")
          cat /tmp/webhook-response.json
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Webhook returned HTTP ${HTTP_CODE}"
            exit 1
          fi
