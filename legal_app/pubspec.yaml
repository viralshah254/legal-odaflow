name: umbrella
description: Umbrella — mobile client for consumers and lawyers.
publish_to: 'none'

version: 1.0.9+9

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  intl: ^0.20.0
  sentry_flutter: ^8.14.1
  showcaseview: ^4.0.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.6
  share_plus: ^10.1.4
  record: ^6.1.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  just_audio: ^0.10.5
  socket_io_client: ^3.1.6
  pdfrx: ^1.0.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.5.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
