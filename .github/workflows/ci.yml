name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: legal_backend/package-lock.json
      - name: Provision FFmpeg for tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          echo "FFMPEG_BIN=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          ffmpeg -version
      - name: Install backend dependencies (retry transient binary downloads)
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - run: npm run prisma:generate
      - run: npm run check:no-mock
      - run: npm run validate:india-act-structure
      - run: npm run export:task-patterns-catalog
      - run: npm run audit:taxonomy-coverage -- --strict
      - run: npm run build
      - name: Cross-client API source contracts
        run: npm test -- --runInBand --runTestsByPath test/contract/mobile-api-paths.spec.ts test/contract/web-api-paths.spec.ts
      - name: Matter Intelligence test gate
        run: npm test -- --testPathPattern="matter-intelligence|mi-intake|contract/matter"
      - name: Security regression tests
        run: npm test -- --runTestsByPath src/admin/super-admin.guard.spec.ts src/common/guards/tenant.guard.spec.ts src/common/guards/tenant-permission.guard.spec.ts src/payments/mpesa.provider.spec.ts src/security/encryption.service.spec.ts
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: legal_web/package-lock.json
      - run: npm ci
      - run: npm run check:no-mock
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
      - name: Generate theme tokens
        run: dart run ../shared/theme/generate_flutter_tokens.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Fetch and verify pinned Gradle distribution
        run: |
          # The public release URL returned 504; use the official release-asset API.
          archive="$RUNNER_TEMP/umbrella-gradle-8.12-all.zip"
          curl --fail --location --retry 3 --retry-all-errors --max-time 600 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/214739944 \
            --output "$archive"
          echo "7ebdac923867a3cec0098302416d1e3c6c0c729fc4e2e05c10637a8af33a76c5  $archive" | sha256sum --check
          python3 - <<'PYGRADLE'
          import os
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          lines = p.read_text().splitlines()
          uri = Path(os.environ['RUNNER_TEMP'], 'umbrella-gradle-8.12-all.zip').as_uri()
          p.write_text('\n'.join('distributionUrl=' + uri if line.startswith('distributionUrl=') else line for line in lines) + '\n')
          PYGRADLE
      - name: Provision checksum-verified PDFium for Android
        run: |
          python3 -m unittest discover -s tool -p 'test_prepare_ci_pdfium.py'
          python3 tool/prepare_ci_pdfium.py --destination "$RUNNER_TEMP/umbrella-pdfium"
      - run: flutter build apk --release --dart-define=API_URL=https://legal-api.odaflow.com/api/v1
