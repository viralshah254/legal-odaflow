name: i18n parity

on:
  push:
    paths:
      - 'shared/i18n/**'
      - 'legal_web/**'
      - 'legal_app/lib/**'
      - '.github/workflows/i18n-parity.yml'
  pull_request:
    paths:
      - 'shared/i18n/**'
      - 'legal_web/**'
      - 'legal_app/lib/**'

jobs:
  check-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify locale key parity
        run: node shared/i18n/scripts/check-parity.js
      - name: Sync web messages and verify JSON
        run: |
          node shared/i18n/scripts/sync-to-web.js
          node shared/i18n/scripts/sync-to-flutter.js
          test -f legal_web/messages/en.json
          test -f legal_app/lib/l10n/app_en.arb
      - name: Translation coverage
        run: node shared/i18n/scripts/check-translation-coverage.js
      - name: Translation key resolution
        run: node shared/i18n/scripts/check-translation-keys.js
      - name: Hardcoded copy regression gate (prior-main baseline)
        run: |
          node --test shared/i18n/scripts/check-hardcoded-strings.test.js
          node shared/i18n/scripts/check-hardcoded-strings.js --baseline=shared/i18n/hardcoded-baseline.json
      - name: Mixed-locale gate
        run: node shared/i18n/scripts/check-mixed-locale.js --strict

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: legal_web/package-lock.json
      - run: npm ci
      - name: Typecheck legal_web
        run: npx tsc --noEmit

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Flutter l10n parity
        run: |
          flutter gen-l10n
          node -e "const m=require('./untranslated_messages.json'); const bad=Object.entries(m).filter(([,v])=>Array.isArray(v)?v.length:Object.keys(v||{}).length); if(bad.length){console.error('Untranslated Flutter messages:',m); process.exit(1)}"
      - name: Analyze Flutter lib
        run: flutter analyze lib/
